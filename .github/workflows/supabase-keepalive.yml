name: Supabase Free-Tier Inactivity Keepalive

on:
  schedule:
    # Runs at 00:00 UTC every 5 days
    - cron: '0 0 */5 * *'
  workflow_dispatch:

jobs:
  ping:
    name: Health Check Ping
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase REST API Endpoint
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            echo "Sending keepalive ping to Supabase..."
            curl -s -o /dev/null -w "%{http_code}" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/rest/v1/"
            echo "Ping completed successfully."
          else
            echo "VITE_SUPABASE_URL not configured yet; skipping ping."
          fi
